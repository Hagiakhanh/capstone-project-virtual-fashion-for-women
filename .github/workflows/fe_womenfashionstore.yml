name: Build and deploy Node.js app to Azure Web App - womenfashionstore

on:
  push:
    branches:
      - FE
  workflow_dispatch:

env:
  WORKING_DIR: ./virtual-fashion-for-women-FE

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: npm

      - name: 📦 Install dependencies and build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm ci
          npm rebuild lightningcss || true
          npm rebuild sharp || true
          npm run build --if-present

      - name: 📤 Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.WORKING_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C76E3B405EF491A9C60A50DD2DB30F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4355095083644928C3A602367C2FCBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_617DD377E7054D98880841A179A1B893 }}

      - name: 🚀 Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'womenfashionstore'
          slot-name: 'Production'
          package: .
