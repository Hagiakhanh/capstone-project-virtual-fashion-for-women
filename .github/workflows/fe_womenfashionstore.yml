name: Build and deploy Node.js app to Azure Web App - womenfashionstore

on:
  push:
    branches:
      - FE
  workflow_dispatch:

# 👇 Thêm permissions ở đây
permissions:
  id-token: write
  contents: read

env:
  WORKING_DIR: ./virtual-fashion-for-women-FE

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'
          
      - name: 🧹 Clean & install dependencies (Linux-safe) AND BUILD
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "📁 Current directory: $(pwd)"
          rm -rf node_modules package-lock.json
          echo "🧱 Fresh install..."
          npm install --cpu=x64 --os=linux sharp
          npm ci || npm install
          npm run build
          echo "✅ Dependencies installed successfully"

      - name: 📤 Upload build artifact (only needed files)
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ${{ env.WORKING_DIR }}/.next
            ${{ env.WORKING_DIR }}/public
            ${{ env.WORKING_DIR }}/package.json
            ${{ env.WORKING_DIR }}/next.config.js
            ${{ env.WORKING_DIR }}/node_modules
            !${{ env.WORKING_DIR }}/node_modules/**/lightningcss*
            !${{ env.WORKING_DIR }}/node_modules/**/sharp*

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: ⬇️ Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./app

      - name: 🔐 Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C76E3B405EF491A9C60A50DD2DB30F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4355095083644928C3A602367C2FCBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_617DD377E7054D98880841A179A1B893 }}

      - name: 🧱 Reinstall native dependencies for Azure
        working-directory: ./app
        run: |
          npm install --platform=linux --arch=x64 sharp lightningcss
          echo "✅ Reinstalled native modules for Linux"

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'womenfashionstore'
          slot-name: 'Production'
          package: ./app

