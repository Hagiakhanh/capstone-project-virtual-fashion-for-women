name: Build and deploy Node.js app to Azure Web App - womenfashionstore

on:
  push:
    branches:
      - FE
  workflow_dispatch:

env:
  WORKING_DIR: ./virtual-fashion-for-women-FE

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: 📦 Clean & Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "📁 Current directory: $(pwd)"
          rm -rf node_modules
          npm ci || npm install
          echo "🧹 Rebuilding native modules for Linux..."
          npm rebuild sharp
          npm rebuild lightningcss
          echo "✅ Node modules rebuilt successfully"

      - name: 🏗️ Build Next.js app
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          echo "🚀 Starting Next.js build..."
          npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.WORKING_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: ⬇️ Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: 🔐 Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C76E3B405EF491A9C60A50DD2DB30F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4355095083644928C3A602367C2FCBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_617DD377E7054D98880841A179A1B893 }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'womenfashionstore'
          slot-name: 'Production'
          package: .
