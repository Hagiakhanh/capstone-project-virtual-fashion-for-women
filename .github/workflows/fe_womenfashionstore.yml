name: Build and deploy Node.js app to Azure Web App - womenfashionstore

on:
  push:
    branches:
      - FE
  workflow_dispatch:

env:
  WORKING_DIR: ./virtual-fashion-for-women-FE

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: 📦 Install dependencies & build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "📁 Current directory: $(pwd)"
          if [ -f package-lock.json ]; then
            echo "✅ Found package-lock.json → using npm ci"
            npm ci
          else
            echo "⚠️ No package-lock.json found → fallback to npm install"
            npm install
          fi
          npm rebuild lightningcss || true
          npm rebuild sharp || true
          npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.WORKING_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: ⬇️ Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: 🔐 Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C76E3B405EF491A9C60A50DD2DB30F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4355095083644928C3A602367C2FCBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_617DD377E7054D98880841A179A1B893 }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'womenfashionstore'
          slot-name: 'Production'
          package: .
