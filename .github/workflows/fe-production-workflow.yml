name: FE CI/CD Next.js to VPS

on:
  push:
    branches: ["FE-Production"]

env:
  SOURCE_DIR: virtual-fashion-for-women-FE
  DEPLOY_DIR: /home/levdefault/nextjs/virtual-fashion-for-women-FE

jobs:

  # ------------------------- #
  #       JOB 1: BUILD        #
  # ------------------------- #
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd $SOURCE_DIR
          npm ci

      - name: Inject .env.production
        run: |
          cd $SOURCE_DIR
          echo "${{ secrets.FE_ENV_FILE }}" > .env.production
          echo "Created .env.production"

      - name: Build Next.js
        run: |
          cd $SOURCE_DIR
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-build
          path: |
            ${{ env.SOURCE_DIR }}/.next
            ${{ env.SOURCE_DIR }}/public
            ${{ env.SOURCE_DIR }}/package.json
            ${{ env.SOURCE_DIR }}/next.config.js
            ${{ env.SOURCE_DIR }}/node_modules


  # ------------------------- #
  #       JOB 2: DEPLOY       #
  # ------------------------- #
  deploy:
    needs: build   # 🔥 build success thì mới chạy deploy
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-build
          path: fe-build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "fe-build/*"
          target: "${{ env.DEPLOY_DIR }}"
          rm: true

      - name: SSH to VPS - Start PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_DIR }}

            echo "🧩 Load Node 20"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20

            echo "🚀 Start bằng PM2"
            if command -v pm2 > /dev/null; then
              pm2 reload vfwfe --update-env || pm2 start "npm run start -- -H 0.0.0.0 -p 3000" --name vfwfe
              pm2 save
            else
              echo "⚠️ PM2 chưa được cài. Cài bằng: npm install -g pm2"
            fi

            echo "🎉 Deploy thành công!"
