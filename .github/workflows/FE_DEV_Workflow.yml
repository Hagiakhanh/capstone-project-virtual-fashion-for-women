name: FE Build & Deploy Next.js SSR to Azure App Service Publish Profile

on:
  push:
    branches:
      - "FE"

env:
  NODE_VERSION: 20.x
  WORKING_DIR: ./virtual-fashion-for-women-FE

jobs:
  # -------------------------------------------------
  # 🔹 Job 1: Build & Test
  # -------------------------------------------------
  build:
    name: 🧱 Build & Test Next.js
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 🌍 Create .env.production file from secret
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "${{ secrets.FE_ENV_FILE }}" > .env.production
          echo "✅ .env.production file created"

      - name: 🧹 Clean & install dependencies AND BUILD
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧹 Cleaning old installs..."
          rm -rf node_modules package-lock.json
          npm install
          npm rebuild sharp lightningcss || true
          npm run build
          echo "✅ Build completed successfully!"

      - name: ✅ Run tests (optional)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test --if-present

  # -------------------------------------------------
  # 🔹 Job 2: Deploy
  # -------------------------------------------------
  deploy:
    name: 🚀 Deploy Next.js SSR to Azure
    runs-on: ubuntu-latest
    needs: build  # ✅ Chạy sau khi job build thành công

    steps:
      - name: 📦 Checkout source
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🌍 Create .env.production file from secret
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "${{ secrets.FE_ENV_FILE }}" > .env.production
          echo "✅ Environment file created!"

      - name: 🧹 Clean & install dependencies AND BUILD
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧹 Cleaning old installs..."
          rm -rf node_modules package-lock.json
          npm install
          npm rebuild sharp lightningcss || true
          npm run build
          echo "✅ Build completed successfully!"

      - name: 📦 Create zip for deployment
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          zip -r release.zip . -x "node_modules/*" ".next/cache/*"
          echo "✅ Release package created successfully!"

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_FE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ${{ env.WORKING_DIR }}/release.zip

