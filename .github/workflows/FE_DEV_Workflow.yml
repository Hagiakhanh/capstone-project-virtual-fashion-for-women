name: Deploy Next.js to Azure

on:
  push:
    branches:
      - FE

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔹 Di chuyển vào đúng thư mục FE
      - name: Move to FE directory
        run: cd virtual-fashion-for-women-FE
        shell: bash

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./virtual-fashion-for-women-FE
        run: npm ci --include=optional

      # ✅ FIX SHARP cho Linux
      - name: Fix Sharp for Linux
        working-directory: ./virtual-fashion-for-women-FE
        run: |
          npm uninstall sharp || true
          npm install --include=optional sharp
          npm rebuild sharp --platform=linux --arch=x64 --force

      # ✅ FIX LightningCSS nếu Next.js > 15
      - name: Fix LightningCSS for Linux
        working-directory: ./virtual-fashion-for-women-FE
        run: |
          npm rebuild lightningcss --platform=linux --arch=x64 --force || true

      - name: Build Next.js app
        working-directory: ./virtual-fashion-for-women-FE
        env:
          NODE_ENV: production
        run: npm run build

      - name: Zip production build
        working-directory: ./virtual-fashion-for-women-FE
        run: zip -r ../nextjs.zip .next public package.json next.config.js node_modules

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'womenfashionstore'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: nextjs.zip
