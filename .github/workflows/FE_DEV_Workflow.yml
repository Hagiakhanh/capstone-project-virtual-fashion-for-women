name: FE Build & Deploy CI/CD

on:
  push:
    branches:
      - FE   # 👈 Nhánh FE bạn muốn deploy

env:
  APP_NAME: "womenfashionstore"     # 👈 Tên App Service trên Azure
  WORKING_DIR: ./virtual-fashion-for-women-FE  # 👈 Thư mục FE của bạn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔧 Rebuild native dependencies (lightningcss)
        run: |
          npm rebuild lightningcss
          npm rebuild sharp || true

      - name: 🏗️ Build Next.js for production
        run: npm run build
      - name: Build Next.js app
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.WORKING_DIR }}
