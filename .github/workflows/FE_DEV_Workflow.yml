name: Build and deploy Node.js app to Azure Web App - womenfashionstore

on:
  push:
    branches:
      - FE
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  WORKING_DIR: ./virtual-fashion-for-women-FE
  APP_NAME: womenfashionstore

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: 🧹 Clean & install dependencies AND BUILD
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧹 Cleaning old installs..."
          rm -rf node_modules package-lock.json
          npm install
          npm run build
          echo "✅ Build completed successfully!"

      # 👇 Thay vì chỉ upload .next, ta upload toàn bộ source cần thiết
      - name: 📤 Upload build artifact (include node_modules)
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ${{ env.WORKING_DIR }}
          # Bỏ qua bớt cache hoặc log
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: ⬇️ Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./app

      - name: 🔐 Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C76E3B405EF491A9C60A50DD2DB30F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4355095083644928C3A602367C2FCBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_617DD377E7054D98880841A179A1B893 }}

      # 👇 Cài lại native module trong môi trường Azure Linux
      - name: 🧱 Install and rebuild dependencies for production
        working-directory: ./app
        run: |
          echo "📦 Installing production dependencies..."
          npm ci || npm install --omit=dev
          npm rebuild sharp lightningcss || true
          echo "✅ Dependencies rebuilt for Azure Linux environment"

      # 👇 Deploy code + kèm startup command để chắc chắn start NextJS đúng
      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          package: ./app
          startup-command: 'npm run start'
