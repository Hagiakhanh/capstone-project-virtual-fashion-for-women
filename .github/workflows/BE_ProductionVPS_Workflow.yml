name: BE CI/CD Docker to VPS

on:
  push:
    branches:
      - 'BE'

env:
  IMAGE_NAME: phuclocnguyen/virtualfashionforwomen
  TAG: latest
  APP_DIR: /home/levdefault/docker/config/virtualfashionforwomen

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/VirtualTryonWomenFashion.sln', '**/*.packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution dependencies
        working-directory: ./VirtualTryonWomenFashion
        run: dotnet restore VirtualTryonWomenFashion.sln

      - name: Build solution
        working-directory: ./VirtualTryonWomenFashion
        run: dotnet build VirtualTryonWomenFashion.sln --configuration Release --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./VirtualTryonWomenFashion
          file: ./VirtualTryonWomenFashion/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << EOF
            APP_DIR="${{ env.APP_DIR }}"
            echo '${{ secrets.APPSETTINGS_PRODUCTION_VPS_JSON }}' > $APP_DIR/appsettings.json

            docker pull ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            docker stop virtualfashionforwomen || true
            docker rm virtualfashionforwomen || true
            docker run -d \
              --name virtualfashionforwomen \
              -p 5000:8080  \
              --restart=always \
              -v \$APP_DIR/appsettings.json:/app/appsettings.json \
              ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          EOF
